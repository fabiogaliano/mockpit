<section class="card" style="max-width: 640px" data-part="team" data-part-label="Team">
  <header class="card-header">
    <h2 class="card-title">Team members</h2>
    <p class="card-desc">Invite people and choose what they can do.</p>
  </header>
  <div class="card-content">
    <form class="row" data-part="invite" data-part-label="Invite">
      <label class="field grow">
        <span class="label">Email</span>
        <input class="input" type="email" placeholder="name@company.com" />
      </label>
      <label class="field grow">
        <span class="label">Role</span>
        <select class="select">
          <option>Viewer</option>
          <option>Editor</option>
          <option>Admin</option>
        </select>
      </label>
      <button class="btn btn-primary" type="submit">Send invite</button>
    </form>
    <table class="table" data-part="members" data-part-label="Members">
      <thead>
        <tr>
          <th>Name</th>
          <th>Role</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Ana Lima</td>
          <td>Admin</td>
          <td><span class="badge">Active</span></td>
        </tr>
        <tr>
          <td>Ben Okafor</td>
          <td>Editor</td>
          <td><span class="badge">Active</span></td>
        </tr>
        <tr>
          <td>Chloe Park</td>
          <td>Viewer</td>
          <td><span class="badge badge-secondary">Pending</span></td>
        </tr>
      </tbody>
    </table>
  </div>
  <footer class="card-footer">
    <button class="btn btn-ghost btn-sm" type="button">Export list</button>
  </footer>
</section>
