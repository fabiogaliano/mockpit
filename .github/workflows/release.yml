name: Release

# Runs after CI passes on main. With changesets pending it opens (or updates)
# the "chore: release packages" PR that versions them; once that PR is merged
# there are none left, and it publishes the new version to npm and creates its
# GitHub release. See docs/releasing.md.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  detect:
    # `branches: [main]` matches the triggering run's head branch by name, which
    # a fork PR from its own "main" also has. Only a push to this repository's
    # main, or a manual run on main, may reach jobs that can push and publish.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install -g npm@11.17.0
      - run: npm ci --ignore-scripts
      - uses: changesets/action/select-mode@v2.1.1
        id: mode

  version:
    needs: detect
    if: needs.detect.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install -g npm@11.17.0
      - run: npm ci --ignore-scripts
      - uses: changesets/action/version@v2.1.1
        with:
          script: npm run release:version
          commit-message: "chore: version packages"
          pr-title: "chore: release packages"
          pr-base-branch: main

  publish:
    needs: detect
    if: needs.detect.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # 11.5+ is what speaks npm trusted publishing (OIDC).
      - run: npm install -g npm@11.17.0
      - run: npm ci --ignore-scripts
      - run: npm run security:audit

      - name: Publish the version unless npm already has it
        id: publish
        env:
          # Trusted publishing needs no token. NPM_TOKEN is only the bootstrap
          # for the very first publish, before npm has a package to attach a
          # trusted publisher to; delete the secret once that is configured.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "mockpit@$version" version >/dev/null 2>&1; then
            echo "mockpit@$version is already on npm; skipping."
            exit 0
          fi
          case "$version" in
            *-alpha*|*-beta*|*-rc*) tag=beta ;;
            *) tag=latest ;;
          esac
          npm publish --provenance --tag "$tag"

      - name: Create the GitHub release unless it exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.publish.outputs.version }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already has a GitHub release; skipping."
            exit 0
          fi
          node scripts/extract-release-notes.ts "$tag" > "$RUNNER_TEMP/notes.md"
          prerelease=()
          case "$VERSION" in *-alpha*|*-beta*|*-rc*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" --target "$RELEASE_SHA" --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
