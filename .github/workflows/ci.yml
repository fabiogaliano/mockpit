name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One Linux job, one npm ci: lint/type/test, the release-note gate, and the
  # packed-CLI smoke test. Cheap checks run first so failures surface fast; the
  # pack round trip runs last. Node 22 is the documented floor and matches every
  # other job — we don't matrix over 24 on PRs.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.17.0
      - run: npm ci --ignore-scripts
      - run: npm run security:audit

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run test:worker

      - name: Release-note changeset
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: |
          git fetch origin main
          npm run changeset:status -- --since=origin/main

      - name: Pack and smoke-test the CLI
        run: |
          npm pack
          npm install -g --ignore-scripts ./mockpit-*.tgz
          mockpit help
          export MOCKPIT_DB=/tmp/mockpit.db MOCKPIT_AGENT=ci
          mockpit serve &
          for i in $(seq 1 20); do curl -sf localhost:8228/api/sessions > /dev/null && break; sleep 0.5; done
          echo '<p data-part="note">ci smoke</p>' > /tmp/smoke.html
          mockpit publish --mock ci-smoke --title "CI smoke" --html /tmp/smoke.html --json | tee /tmp/out.json
          grep -q '"sessionId"' /tmp/out.json
          mockpit demo | grep -q "Seeded"
          curl -sf localhost:8228/guide > /dev/null

  # Performance regression gate. Runs the in-process benchmark suites and compares
  # against the committed baseline (bench/baseline.json).
  #
  # `--gate deterministic` means only byte counts and operation counts can fail
  # the job. Those are pure functions of our code, so they mean the same thing on
  # a shared runner as on a laptop. Timings and memory are still measured, still
  # compared, and still printed — a regression shows up in the log — but they
  # can't fail the build, because a flaky perf gate is one people learn to re-run
  # and then stop reading. See bench/README.md.
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.17.0
      - run: npm ci --ignore-scripts
      - run: npm run bench:check -- --gate deterministic

  e2e:
    runs-on: ubuntu-latest
    # A hung `playwright install --with-deps` (apt) otherwise holds the job, and
    # with it the release, for GitHub's 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.17.0
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  # Windows uses entirely separate code paths in the CLI (PowerShell process
  # tree walk in agentPid, cmd /c start for --open) and OS-specific path/state
  # keying — none of which the Linux jobs exercise. It bills at 2x, so run it
  # only on push to main, not on every PR. Keep it lean: unit tests plus a
  # packed serve+publish round trip that runs the Windows agentPid walk.
  windows-smoke:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.17.0
      - run: npm ci --ignore-scripts
      - run: npm run security:audit
      - run: npm test
      - run: npm pack
      - name: Install packed CLI
        shell: bash
        run: npm install -g --ignore-scripts ./mockpit-*.tgz
      - run: mockpit help
        shell: bash
      - name: Smoke-test server and publish round trip
        shell: bash
        run: |
          export MOCKPIT_DB="$RUNNER_TEMP/mockpit.db" MOCKPIT_AGENT=ci
          mockpit serve &
          for i in $(seq 1 20); do curl -sf localhost:8228/api/sessions > /dev/null && break; sleep 0.5; done
          echo '<p data-part="note">ci smoke</p>' > "$RUNNER_TEMP/smoke.html"
          mockpit publish --mock ci-smoke --title "CI smoke" --html "$RUNNER_TEMP/smoke.html" --json | tee "$RUNNER_TEMP/out.json"
          grep -q '"sessionId"' "$RUNNER_TEMP/out.json"
          curl -sf localhost:8228/guide > /dev/null
