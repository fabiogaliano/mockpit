<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mockpit</title>
    <script>
      // Before first paint, so a light-theme reload never flashes dark.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("mockpit-theme") === "light" ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
